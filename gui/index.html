<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LarfnOS</title>
<link rel="stylesheet" href="css/main.css">
</head>
<!-- data-theme 决定桌面壁纸主题，可由设置应用动态切换 -->
<body data-theme="aurora">
  <!-- 壁纸层 -->
  <div id="wallpaper" aria-hidden="true"></div>

  <!-- 桌面图标层 -->
  <div id="desktop">
    <div id="desktop-icons" aria-label="桌面图标"></div>
  </div>

  <!-- 窗口层 -->
  <div id="windows-layer" aria-label="窗口"></div>

  <!-- 顶栏（系统状态栏） -->
  <header id="topbar">
    <div class="tb-left">
      <button id="btn-activities" class="tb-btn" aria-label="活动概览" title="活动概览">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="5" cy="5" r="2" fill="currentColor"/>
          <circle cx="19" cy="5" r="2" fill="currentColor"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
          <circle cx="5" cy="19" r="2" fill="currentColor"/>
          <circle cx="19" cy="19" r="2" fill="currentColor"/>
        </svg>
        <span>活动</span>
      </button>
      <button id="btn-appmenu" class="tb-btn" aria-label="应用菜单">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>应用</span>
      </button>
    </div>

    <div class="tb-center">
      <button id="tb-clock" class="tb-clock" aria-label="日期与时间">
        <span id="clock-time">--:--</span>
        <span id="clock-date">----年--月--日 周-</span>
      </button>
      <div id="calendar-pop" class="popup" hidden></div>
    </div>

    <div class="tb-right">
      <button id="btn-net" class="tb-ic" aria-label="网络状态" title="网络">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10.5 10.5 0 0 1 13 0M9 15.5a6 6 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="19" r="1.4" fill="currentColor"/>
        </svg>
      </button>
      <button id="btn-vol" class="tb-ic" aria-label="音量" title="音量">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" opacity=".9"/>
          <path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-batt" class="tb-ic" aria-label="电源" title="电源">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <rect x="2.5" y="8" width="15" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <rect x="4" y="9.5" width="10" height="5" rx="1" fill="currentColor" opacity=".8"/>
          <path d="M20.5 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-status" class="tb-btn status" aria-label="系统状态">
        <span id="stat-cpu-mini">CPU --%</span>
        <span id="stat-mem-mini">MEM --%</span>
      </button>
    </div>
  </header>

  <!-- 快捷设置面板 -->
  <aside id="quick-panel" class="popup right" hidden>
    <h3>快捷设置</h3>
    <div class="qp-row">
      <span class="qp-label">亮度</span>
      <input id="qp-bright" type="range" min="0" max="100" value="80">
      <span id="qp-bright-val" class="qp-val">80%</span>
    </div>
    <div class="qp-row">
      <span class="qp-label">音量</span>
      <input id="qp-volume" type="range" min="0" max="100" value="60">
      <span id="qp-vol-val" class="qp-val">60%</span>
    </div>
    <div class="qp-toggle">
      <button id="qp-wifi" class="qbtn on">无线网络</button>
      <button id="qp-bt" class="qbtn on">蓝牙</button>
      <button id="qp-theme" class="qbtn">切换深色</button>
    </div>
    <div class="qp-actions">
      <button id="qp-settings">设置</button>
      <button id="qp-lock">锁定</button>
      <button id="qp-power" class="danger">电源</button>
    </div>
    <div class="qp-info">
      <span id="qp-net">网络：--</span>
      <span id="qp-ip">IPv4：--</span>
    </div>
  </aside>

  <!-- 启动台（应用网格） -->
  <div id="launcher" hidden>
    <div class="launcher-inner">
      <input id="launcher-search" type="text" placeholder="搜索应用...">
      <div id="launcher-grid"></div>
    </div>
  </div>

  <!-- Dock（程序坞） -->
  <nav id="dock" aria-label="程序坞">
    <div id="dock-apps"></div>
    <div class="dock-sep" aria-hidden="true"></div>
    <button id="btn-dock-launcher" class="dock-icon" aria-label="显示所有应用" title="显示所有应用">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <circle cx="5" cy="5" r="2.2" fill="currentColor"/>
        <circle cx="12" cy="5" r="2.2" fill="currentColor"/>
        <circle cx="19" cy="5" r="2.2" fill="currentColor"/>
        <circle cx="5" cy="12" r="2.2" fill="currentColor"/>
        <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
        <circle cx="19" cy="12" r="2.2" fill="currentColor"/>
        <circle cx="5" cy="19" r="2.2" fill="currentColor"/>
        <circle cx="12" cy="19" r="2.2" fill="currentColor"/>
        <circle cx="19" cy="19" r="2.2" fill="currentColor"/>
      </svg>
    </button>
  </nav>

  <!-- 桌面右键菜单 -->
  <div id="ctx-menu" class="menu" hidden></div>

  <!-- 电源对话框 -->
  <div id="power-dialog" class="modal" hidden>
    <div class="modal-card">
      <h2>电源</h2>
      <p id="pd-msg">选择要执行的操作</p>
      <div class="modal-actions">
        <button id="pd-cancel" class="ghost">取消</button>
        <button id="pd-reboot">重启</button>
        <button id="pd-shutdown" class="danger">关机</button>
      </div>
    </div>
  </div>

  <!-- 通知与轻提示 -->
  <div id="toast-root" aria-live="polite"></div>
  <div id="notification-stack" aria-live="polite"></div>

  <script src="js/bridge.js"></script>
  <script src="js/sysapi.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
